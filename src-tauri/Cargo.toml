[package]
name = "jads-brain"
version = "0.1.0"
description = "Jad's Brain — Personal Second Brain"
authors = []
edition = "2021"

[lib]
name = "jads_brain_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri             = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
serde_yaml        = "0.9"
rusqlite          = { version = "0.32", features = ["bundled"] }
walkdir           = "2"
regex             = "1"
chrono            = { version = "0.4", features = ["serde"] }
reqwest           = { version = "0.12", features = ["json"] }
anyhow            = "1"
tokio             = { version = "1", features = ["full"] }
pdf-extract       = "0.7"

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
codegen-units = 1
